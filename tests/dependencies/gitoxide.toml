[package]
edition = "2021"
rust-version = "1.82"
name = "gitoxide"
version = "0.52.0"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
build = "build.rs"
include = [
    "src/**/*",
    "/build.rs",
    "LICENSE-*",
    "README.md",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
default-run = "gix"
description = "A command-line application for interacting with git repositories"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/GitoxideLabs/gitoxide"
resolver = "2"

[package.metadata.docs.rs]
features = [
    "document-features",
    "max",
]

[package.metadata.cargo-machete]
ignored = [
    "crosstermion",
    "serde_derive",
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/gitoxide-max-pure-v{ version }-{ target }{ archive-suffix }"
bin-dir = "gitoxide-max-pure-v{ version }-{ target }/{ bin }{ binary-ext }"

[features]
cache-efficiency-debug = ["gix-features/cache-efficiency-debug"]
default = ["max"]
fast = [
    "gix/max-performance",
    "gix/comfort",
]
fast-safe = ["fast"]
gitoxide-core-async-client = [
    "gitoxide-core/async-client",
    "futures-lite",
]
gitoxide-core-blocking-client = ["gitoxide-core/blocking-client"]

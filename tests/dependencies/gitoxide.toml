    "dep:tracing-forest",
    "dep:tracing-subscriber",
    "dep:tracing",
    "gix-features/tracing",
    "gix-features/tracing-detail",
]

[lib]
name = "gitoxide"
path = "src/lib.rs"

[[bin]]

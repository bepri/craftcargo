[package]
name = "debcargo"
version = "2.7.12+alpha.0"
authors = [
 "Josh Triplett <josh@joshtriplett.org>",
 "Ximin Luo <infinity0@debian.org>",
 "Vasudev Kamath <vasudev@copyninja.info>",
 "Fabian Grünbichler <debian@fabian.gruenbichler.email>",
]
license = "MIT/Apache-2.0"
repository = "https://salsa.debian.org/rust-team/debcargo"
description = "Create a Debian package from a Cargo crate."
edition = "2021"
rust-version = "1.58"

[dependencies]
anyhow = "1.0"
cargo = "0.91"
cargo-util = "0.2.14"
cargo-util-schemas = "0.10"
clap = { version = "4.5", features = ["cargo", "derive", "wrap_help"] }
clap_mangen = { version = "0.2.29" }
chrono = "0.4.31"
env_logger = "0.11"
filetime = "0.2"
flate2 = "1"
git2 = ">= 0.19, < 0.21"
glob = "0.3"
itertools = "0.13"
log = "0.4"
nu-ansi-term = "0.50"
regex = "1.0"
semver = "1"
serde = "1"
serde_derive = "1"
tar = "0.4"
textwrap = "0.16"
tempfile = "3"
toml = "0.8"
walkdir = "2"
debian-control = { version = "0.2.14", optional = true, default-features = false, features = ["lossless"] }

[features]
default = []
update-dependencies = ["debian-control"]

[lints.clippy]
uninlined_format_args = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_semicolon = "warn"
redundant_closure_for_method_calls = "warn"
explicit_iter_loop = "warn"
items_after_statements = "warn"
if_not_else = "warn"
manual_string_new = "warn"
wildcard_imports = "warn"
flat_map_option = "warn"
enum_glob_use = "warn"
needless_pass_by_value = "warn"
ref_option = "warn"
ref_option_ref = "warn"
single_char_pattern = "warn"
default_trait_access = "warn"
explicit_into_iter_loop = "warn"
inefficient_to_string = "warn"
single_match_else = "warn"
map_unwrap_or = "warn"
unnested_or_patterns = "warn"
redundant_else = "warn"
doc_markdown = "warn"

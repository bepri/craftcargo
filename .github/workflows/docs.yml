name: Deploy Docs

on:
  push:
    branches: [main, experimental/hack]
    paths:
      - 'book/**'
      - 'docs/**'
      - 'README-craftcargo.md'
      - 'HACKING.md'
      - 'TODO.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MDBOOK_VERSION=$(gh api repos/rust-lang/mdBook/releases/latest --jq '.tag_name')
          echo "Installing mdBook ${MDBOOK_VERSION}"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz
          chmod +x mdbook
          sudo mv mdbook /usr/local/bin/
          mdbook --version

      - name: Build book
        run: cd book && mdbook build

      - name: Upload artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

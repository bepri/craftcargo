name: Scheduled Bug Hunt

on:
  schedule:
    # Daily at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  bug-hunt:
    name: Agent Bug Hunt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Run tests and capture failures
        id: tests
        continue-on-error: true
        run: |
          cargo test 2>&1 | tee test-output.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Run clippy analysis
        id: clippy
        continue-on-error: true
        run: |
          cargo clippy --all-targets 2>&1 | tee clippy-output.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Check for unsafe code patterns
        id: unsafe
        run: |
          echo "## Unsafe code scan" > unsafe-output.txt
          grep -rn "unsafe" --include="*.rs" src/ || echo "No unsafe blocks found" >> unsafe-output.txt
          cat unsafe-output.txt

      - name: Check for todo/fixme/hack markers
        id: markers
        run: |
          echo "## Code markers found" > markers-output.txt
          grep -rn "todo!\|TODO\|FIXME\|HACK\|XXX" --include="*.rs" src/ >> markers-output.txt || true
          cat markers-output.txt

      - name: Run cargo audit (if available)
        id: audit
        continue-on-error: true
        run: |
          cargo install cargo-audit 2>/dev/null || true
          cargo audit 2>&1 | tee audit-output.txt || true

      - name: Fuzz-like edge case testing
        id: fuzz
        continue-on-error: true
        run: |
          # Build in release mode to catch optimisation-related issues
          cargo build --release 2>&1 | tee build-release-output.txt

      - name: Compile findings report
        id: report
        run: |
          FINDINGS=""
          FOUND_ISSUES=false

          # Check test failures
          if [ -f test-output.txt ] && grep -q "FAILED" test-output.txt; then
            FINDINGS="${FINDINGS}\n## Test Failures\n\`\`\`\n$(grep -A 5 "FAILED\|panicked" test-output.txt | head -50)\n\`\`\`\n"
            FOUND_ISSUES=true
          fi

          # Check clippy warnings
          if [ -f clippy-output.txt ] && grep -q "warning\|error" clippy-output.txt; then
            CLIPPY_ISSUES=$(grep -c "warning\[" clippy-output.txt || echo "0")
            if [ "$CLIPPY_ISSUES" -gt 0 ]; then
              FINDINGS="${FINDINGS}\n## Clippy Warnings ($CLIPPY_ISSUES)\n\`\`\`\n$(grep -B 1 -A 3 "warning\[" clippy-output.txt | head -80)\n\`\`\`\n"
              FOUND_ISSUES=true
            fi
          fi

          # Check audit results
          if [ -f audit-output.txt ] && grep -q "Vulnerability\|vulnerability" audit-output.txt; then
            FINDINGS="${FINDINGS}\n## Security Audit\n\`\`\`\n$(cat audit-output.txt | head -50)\n\`\`\`\n"
            FOUND_ISSUES=true
          fi

          # Check code markers (always report as informational)
          if [ -f markers-output.txt ] && [ "$(wc -l < markers-output.txt)" -gt 1 ]; then
            MARKER_COUNT=$(grep -c "todo!\|TODO\|FIXME\|HACK\|XXX" markers-output.txt || echo "0")
            FINDINGS="${FINDINGS}\n## Code Markers ($MARKER_COUNT)\n\`\`\`\n$(cat markers-output.txt | head -40)\n\`\`\`\n"
          fi

          echo "found_issues=$FOUND_ISSUES" >> "$GITHUB_OUTPUT"

          # Write full report
          {
            echo "body<<REPORT_EOF"
            echo "# 🐛 Daily Bug Hunt Report"
            echo ""
            echo "Automated scan run on $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            if [ "$FOUND_ISSUES" = "true" ]; then
              echo -e "$FINDINGS"
            else
              echo "No critical issues found today. ✅"
              echo ""
              echo -e "$FINDINGS"
            fi
            echo ""
            echo "---"
            echo "*This issue was automatically generated by the scheduled bug hunt workflow.*"
            echo "REPORT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open issue if bugs found
        if: steps.report.outputs.found_issues == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_BODY: ${{ steps.report.outputs.body }}
        run: |
          gh issue create \
            --title "🐛 Bug Hunt: Issues found $(date -u '+%Y-%m-%d')" \
            --body "$REPORT_BODY" \
            --label "bug-hunt,automated"

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bug-hunt-results
          path: |
            test-output.txt
            clippy-output.txt
            audit-output.txt
            markers-output.txt
            unsafe-output.txt
            build-release-output.txt
          retention-days: 14
